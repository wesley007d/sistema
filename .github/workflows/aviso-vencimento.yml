name: Aviso de vencimento (mensalidade)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de cron do Auto Peças System
        run: |
          curl -sf "https://sistemanegocios.com.br/api/cron/aviso-vencimento?secret=${{ secrets.CRON_SECRET }}"
