# Backup automático do banco (Neon Postgres).
#
# - De hora em hora das 8h às 19h (horário de Brasília), segunda a sábado:
#   guardado por 3 dias.
# - Todo dia às 3h (horário de Brasília): guardado por 30 dias.
#
# O GitHub atrasa ou pula horários agendados quando está sobrecarregado
# (principalmente na hora cheia). Por isso os horários são em minutos
# "quebrados" e o backup de 30 dias não depende do horário das 3h: a primeira
# execução que encontrar mais de 20h sem um backup "-diario" vira o diário.
#
# O repositório é público, então o arquivo é criptografado (AES-256) antes de
# subir. Sem a senha BACKUP_PASSWORD ninguém consegue abrir.
#
# Secrets necessários: DATABASE_URL (banco de produção) e BACKUP_PASSWORD.
#
# Para restaurar: baixar o artifact em Actions → execução → Artifacts, e então
#   gpg --batch --passphrase "SENHA" -d backup-XXXX.dump.gpg > backup.dump
#   pg_restore --clean --if-exists --no-owner --no-acl -d "URL_DO_BANCO" backup.dump

name: Backup do banco

on:
  schedule:
    - cron: "23 11-22 * * 1-6" # 8h–19h BRT, seg–sáb
    - cron: "37 6 * * *" # 3h BRT, todo dia
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar e criptografar o backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSWORD" ]; then
            echo "Faltam os secrets DATABASE_URL e/ou BACKUP_PASSWORD" >&2
            exit 1
          fi
          # pg_dump precisa da conexão direta, não do pooler do Neon.
          URL="$(printf '%s' "$DATABASE_URL" | sed 's/-pooler\./\./')"
          STAMP="$(TZ=America/Sao_Paulo date +%Y-%m-%d_%Hh%M)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          docker run --rm -e URL="$URL" postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-acl "$URL"' > backup.dump
          test -s backup.dump
          printf '%s' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "backup-$STAMP.dump.gpg" backup.dump
          rm backup.dump
          ls -lh "backup-$STAMP.dump.gpg"

      - name: Decidir se este é o backup diário
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DESDE="$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          N="$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name | endswith(\"-diario\")) | select(.created_at > \"$DESDE\")] | length")"
          if [ "$N" = "0" ]; then
            echo "SUFIXO=-diario" >> "$GITHUB_ENV"
            echo "DIAS=30" >> "$GITHUB_ENV"
            echo "Este backup vai ser o diário (guardado 30 dias)"
          else
            echo "SUFIXO=" >> "$GITHUB_ENV"
            echo "DIAS=3" >> "$GITHUB_ENV"
          fi

      - name: Guardar backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}${{ env.SUFIXO }}
          path: backup-${{ env.STAMP }}.dump.gpg
          retention-days: ${{ env.DIAS }}
          compression-level: 0
